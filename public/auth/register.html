<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue: #2563eb;
    --blue-light: #60a5fa;
    --blue-pale: #dbeafe;
    --accent: #1d4ed8;
    --text: #1e293b;
    --muted: #64748b;
    --white: #ffffff;
    --card-bg: rgba(255,255,255,0.88);
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: #f0f7ff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  .bg-canvas {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 40%, #f8faff 100%);
    z-index: 0;
  }

  .petal {
    position: absolute;
    opacity: 0;
    animation: floatUp linear infinite;
    pointer-events: none;
  }

  .flower {
    position: absolute;
    pointer-events: none;
    animation: sway ease-in-out infinite;
  }

  .flower svg { display: block; }

  @keyframes floatUp {
    0%   { transform: translateY(110vh) rotate(0deg) scale(0.6); opacity: 0; }
    10%  { opacity: 0.7; }
    90%  { opacity: 0.5; }
    100% { transform: translateY(-10vh) rotate(360deg) scale(1); opacity: 0; }
  }

  @keyframes sway {
    0%, 100% { transform: rotate(-8deg) translateY(0); }
    50%       { transform: rotate(8deg) translateY(-12px); }
  }

  @keyframes spin-slow {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  .card {
    position: relative;
    z-index: 10;
    display: flex;
    width: 92%;
    max-width: 860px;
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 28px;
    box-shadow:
      0 4px 6px rgba(37,99,235,0.07),
      0 20px 60px rgba(37,99,235,0.14),
      inset 0 1px 0 rgba(255,255,255,0.9);
    overflow: hidden;
    min-height: 520px;
  }

  .form-panel {
    flex: 1;
    padding: 48px 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 32px;
  }

  .brand-icon {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, var(--blue), var(--blue-light));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 12px rgba(37,99,235,0.3);
  }

  .brand-icon svg { color: white; width: 20px; height: 20px; }

  .brand-name {
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem;
    color: var(--blue);
    letter-spacing: -0.3px;
  }

  h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.9rem;
    color: var(--text);
    margin-bottom: 6px;
    line-height: 1.2;
  }

  .subtitle {
    color: var(--muted);
    font-size: 0.875rem;
    margin-bottom: 28px;
  }

  .field { margin-bottom: 14px; }

  .field label {
    display: block;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .input-wrap {
    display: flex;
    align-items: center;
    background: #f8faff;
    border: 1.5px solid #e2eaf8;
    border-radius: 12px;
    padding: 0 14px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .input-wrap:focus-within {
    border-color: var(--blue-light);
    box-shadow: 0 0 0 3px rgba(96,165,250,0.2);
    background: #fff;
  }

  .input-wrap svg {
    width: 16px; height: 16px;
    color: var(--blue-light);
    flex-shrink: 0;
  }

  .input-wrap input {
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    width: 100%;
    padding: 12px 10px;
  }

  .input-wrap input::placeholder { color: #b0bec5; }

  .btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--blue) 0%, #3b82f6 100%);
    color: white;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    margin-top: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 4px 20px rgba(37,99,235,0.35);
    transition: transform 0.15s, box-shadow 0.15s;
    letter-spacing: 0.2px;
  }

  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(37,99,235,0.4);
  }

  .btn:active { transform: translateY(0); }
  .btn svg { width: 17px; height: 17px; }

  .footer-link {
    text-align: center;
    margin-top: 18px;
    font-size: 0.83rem;
    color: var(--muted);
  }

  .footer-link a {
    color: var(--blue);
    text-decoration: none;
    font-weight: 600;
  }

  .footer-link a:hover { text-decoration: underline; }

  .image-panel {
    width: 320px;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }

  .image-panel img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
  }

  .image-panel::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg,
      rgba(37,99,235,0.15) 0%,
      rgba(96,165,250,0.08) 100%);
    z-index: 1;
  }

  .image-badge {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(12px);
    border-radius: 50px;
    padding: 8px 18px;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--blue);
    white-space: nowrap;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .image-badge svg { width: 14px; height: 14px; }

  .toast {
    position: fixed;
    top: 24px;
    right: 24px;
    z-index: 100;
    background: white;
    border-radius: 14px;
    padding: 14px 18px;
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--text);
    display: none;
    align-items: center;
    gap: 10px;
    box-shadow: 0 8px 32px rgba(37,99,235,0.18), 0 2px 8px rgba(0,0,0,0.08);
    border-left: 4px solid var(--blue);
    animation: slideIn 0.3s ease;
    max-width: 300px;
  }

  @keyframes slideIn {
    from { transform: translateX(30px); opacity: 0; }
    to   { transform: translateX(0);   opacity: 1; }
  }

  @media (max-width: 680px) {
    .card { flex-direction: column; max-width: 420px; }
    .image-panel { width: 100%; height: 200px; order: -1; }
    .form-panel { padding: 32px 24px; }
    h2 { font-size: 1.5rem; }
  }

  @media (min-width: 681px) and (max-width: 900px) {
    .image-panel { width: 260px; }
    .form-panel { padding: 36px 30px; }
  }

  .bg-dots {
    position: fixed;
    inset: 0;
    background-image: radial-gradient(circle, #bfdbfe 1px, transparent 1px);
    background-size: 32px 32px;
    opacity: 0.45;
    z-index: 0;
    pointer-events: none;
  }
</style>
</head>

<body>

<div class="bg-canvas"></div>
<div class="bg-dots"></div>

<svg style="display:none">
  <defs>
    <symbol id="flower5" viewBox="-20 -20 40 40">
      <g>
        <ellipse cx="0" cy="-10" rx="5" ry="10" fill="currentColor" opacity="0.8" transform="rotate(0)"/>
        <ellipse cx="0" cy="-10" rx="5" ry="10" fill="currentColor" opacity="0.8" transform="rotate(72)"/>
        <ellipse cx="0" cy="-10" rx="5" ry="10" fill="currentColor" opacity="0.8" transform="rotate(144)"/>
        <ellipse cx="0" cy="-10" rx="5" ry="10" fill="currentColor" opacity="0.8" transform="rotate(216)"/>
        <ellipse cx="0" cy="-10" rx="5" ry="10" fill="currentColor" opacity="0.8" transform="rotate(288)"/>
        <circle cx="0" cy="0" r="4" fill="#fff" opacity="0.9"/>
      </g>
    </symbol>
  </defs>
</svg>

<div class="card">
  <div class="form-panel">
    <div class="brand">
      <div class="brand-icon">
        <i data-lucide="sparkles"></i>
      </div>
      <span class="brand-name">Nexus Light</span>
    </div>

    <h2>Crear cuenta</h2>
    <p class="subtitle">Únete y comienza tu experiencia</p>

    <div class="field">
      <label>Usuario</label>
      <div class="input-wrap">
        <i data-lucide="user"></i>
        <input id="username" placeholder="Tu nombre de usuario" autocomplete="username">
      </div>
    </div>

    <div class="field">
      <label>Contraseña</label>
      <div class="input-wrap">
        <i data-lucide="lock"></i>
        <input id="password" type="password" placeholder="Crea tu contraseña" autocomplete="new-password">
      </div>
    </div>

    <div class="field">
      <label>Confirmar contraseña</label>
      <div class="input-wrap">
        <i data-lucide="shield-check"></i>
        <input id="confirmPassword" type="password" placeholder="Repite tu contraseña" autocomplete="new-password">
      </div>
    </div>

    <button class="btn" id="registerBtn">
      <i data-lucide="rocket"></i>
      Registrarme
    </button>

    <p class="footer-link">
      ¿Ya tienes cuenta? <a href="/login">Iniciar sesión</a>
    </p>
  </div>

  <div class="image-panel">
    <img
      src="https://raw.githubusercontent.com/Dev-lxyz/upload/main/uploads/lmhq7.jpeg"
      alt="Banner decorativo"
      loading="eager"
    >
    <div class="image-badge">
      <i data-lucide="star"></i>
      Bienvenido
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<audio id="successSound">
  <source src="https://assets.mixkit.co/sfx/preview/mixkit-positive-interface-beep-221.mp3" type="audio/mpeg">
</audio>

<script src="/auth/script.js"></script>
<script src="/auth/register.js"></script>

</body>
</html>
